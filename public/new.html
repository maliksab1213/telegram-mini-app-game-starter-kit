<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - StoryVibe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/new.css">
</head>
<body>
    <div id="new-user-app">
        <!-- Loading Screen -->
        <div id="new-loading" class="new-screen active">
            <div class="loading-content">
                <div class="spinner-border text-warning mb-3" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <h3 class="text-light">Loading...</h3>
            </div>
        </div>

        <!-- Welcome & Name Input Screen -->
        <div id="new-welcome" class="new-screen d-none">
            <div class="welcome-container">
                <div class="welcome-card">
                    <div class="logo-section">
                        <div class="welcome-title">Welcome to</div>
                        <div class="game-logo">StoryVibe</div>
                        <div class="game-subtitle">Write Your Way to Success!</div>
                    </div>
                    
                    <div class="name-input-section">
                        <input 
                            type="text" 
                            id="player-name-input" 
                            class="name-input" 
                            placeholder="Enter your author name" 
                            maxlength="15"
                            autocomplete="off"
                            spellcheck="false">
                        <div class="input-helper">Only letters & spaces (3-15 characters)</div>
                        <div id="name-error" class="error-message d-none"></div>
                        <button id="continue-btn" class="continue-button" disabled>
                            <span class="btn-text">Start Writing</span>
                            <span class="btn-arrow">→</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error Screen -->
        <div id="new-error" class="new-screen d-none">
            <div class="error-content">
                <h2 class="text-danger">🚫 Access Denied</h2>
                <p class="text-light" id="new-error-message">Invalid access</p>
                <button class="btn btn-warning" onclick="window.history.back()">Go Back</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/new.js"></script>
</body>
</html>
