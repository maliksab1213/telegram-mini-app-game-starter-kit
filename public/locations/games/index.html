<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryVibe Games</title>
    <link rel="stylesheet" href="/locations/games/games.css">
    <link rel="stylesheet" href="/locations/games/rockpaper.css">
    <link rel="stylesheet" href="/locations/games/coinflip.css">
    <link rel="stylesheet" href="/locations/games/headtails.css">
    <link rel="stylesheet" href="/locations/games/glassball.css">
    <link rel="stylesheet" href="/locations/games/football.css">
    <link rel="stylesheet" href="/locations/games/holemole.css">
    <link rel="stylesheet" href="/locations/games/memorygame.css">
    <link rel="stylesheet" href="/locations/games/sequencematch.css">
    <link rel="stylesheet" href="/locations/games/shootout.css">
</head>
<body>
    <!-- Games Main View -->
    <div class="games-container" id="games-main-view">
        <div class="games-header">
            <button class="back-btn" id="main-back-btn">← Back to Map</button>
            <div class="games-title">🎮 StoryVibe Games</div>
        </div>

        <div class="games-grid" id="games-grid">
            <!-- Games will be loaded here -->
        </div>
    </div>

    <!-- Rock Paper Scissors Game View -->
    <div class="game-container d-none" id="rockpaper-game-view">
        <!-- Game content loaded by rockpaper.js -->
    </div>

    <!-- Coin Flip Game View -->
    <div class="game-container d-none" id="coinflip-game-view">
        <!-- Game content loaded by coinflip.js -->
    </div>
    
    <!-- Head & Tails Game View -->
    <div class="game-container d-none" id="headtails-game-view">
        <!-- Game content loaded by headtails.js -->
    </div>
    
    <!-- Glass Ball Game View -->
    <div class="game-container d-none" id="glassball-game-view">
        <!-- Game content loaded by glassball.js -->
    </div>

    <!-- Football Game View -->
    <div class="game-container d-none" id="football-game-view">
        <!-- Game content loaded by football.js -->
    </div>

    <!-- Hole Mole Game View -->
    <div class="game-container d-none" id="holemole-game-view">
        <!-- Game content loaded by holemole.js -->
    </div>

    <!-- Memory Game View -->
    <div class="game-container d-none" id="memorygame-game-view">
        <!-- Game content loaded by memorygame.js -->
    </div>

    <!-- Sequence Match Game View -->
    <div class="game-container d-none" id="sequencematch-game-view">
        <!-- Game content loaded by sequencematch.js -->
    </div>

    <!-- Shootout Game View -->
    <div class="game-container d-none" id="shootout-game-view">
        <!-- Game content loaded by shootout.js -->
    </div>

    <!-- JavaScript Files -->
    <script src="/locations/games/gamesscript.js"></script>
    <script src="/locations/games/rockpaper.js"></script>
    <script src="/locations/games/coinflip.js"></script>
    <script src="/locations/games/headtails.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.55.2/phaser.min.js"></script>
    <script src="/locations/games/glassball.js"></script>
    <script src="/locations/games/football.js"></script>
    <script src="/locations/games/holemole.js"></script>
    <script src="/locations/games/memorygame.js"></script>
    <script src="/locations/games/sequencematch.js"></script>
    <script src="/locations/games/shootout.js"></script>
</body>
</html>
