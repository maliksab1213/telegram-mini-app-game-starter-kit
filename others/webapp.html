<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(76, 175, 80, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(46, 125, 50, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(102, 187, 106, 0.1) 0%, transparent 50%);
            animation: particleFloat 25s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-30px) rotate(120deg); }
            66% { transform: translateY(30px) rotate(240deg); }
        }

        .welcome-container {
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .welcome-card {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7) 0%, rgba(20, 20, 20, 0.8) 100%);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            border: 2px solid;
            border-image: linear-gradient(135deg, #4CAF50, #66BB6A, #81C784, #4CAF50) 1;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(76, 175, 80, 0.2),
                0 0 50px rgba(76, 175, 80, 0.15);
            animation: cardGlow 4s ease-in-out infinite alternate;
        }

        @keyframes cardGlow {
            0% { box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(76, 175, 80, 0.2), 0 0 30px rgba(76, 175, 80, 0.15); }
            100% { box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(76, 175, 80, 0.3), 0 0 50px rgba(76, 175, 80, 0.25); }
        }

        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: welcomePulse 3s ease-in-out infinite;
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(76, 175, 80, 0.4));
        }

        @keyframes welcomePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 50%, #81C784 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .welcome-message {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .bot-info {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .bot-username {
            font-size: 1.2rem;
            color: #4CAF50;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .play-button {
            width: 100%;
            padding: 18px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 
                0 10px 25px rgba(76, 175, 80, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .play-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .play-button:hover::before {
            left: 100%;
        }

        .play-button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 35px rgba(76, 175, 80, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #66BB6A 0%, #388E3C 100%);
        }

        .play-button:active {
            transform: translateY(-1px);
            box-shadow: 
                0 8px 20px rgba(76, 175, 80, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .play-icon {
            font-size: 1.5rem;
            animation: playFloat 2.5s ease-in-out infinite;
        }

        @keyframes playFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .welcome-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(76, 175, 80, 0.2);
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }

        @media (max-width: 576px) {
            .welcome-card {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .welcome-title {
                font-size: 1.5rem;
            }
            
            .welcome-icon {
                font-size: 3rem;
            }
            
            .welcome-message {
                font-size: 1rem;
            }
            
            .play-button {
                padding: 16px 20px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-card">
            <div class="welcome-icon">🎮</div>
            <h1 class="welcome-title">{{BOT_NAME}}</h1>
            <p class="welcome-message">
                Welcome! Click on Play button to start your journey
            </p>
            
            <div class="bot-info">
                <div class="bot-username">@{{BOT_USERNAME}}</div>
            </div>
            
            <button class="play-button" onclick="openTelegram()">
                <span class="play-icon">✈️</span>
                <span>Play</span>
            </button>
            
            <div class="welcome-footer">
                Start • Play • Earn
            </div>
        </div>
    </div>

    <script>
        function openTelegram() {
            const button = event.target.closest('.play-button');
            const botUsername = '{{BOT_USERNAME}}';
            const telegramUrl = `https://t.me/${botUsername}`;
            
            button.innerHTML = '<span class="play-icon">🚀</span><span>Starting...</span>';
            button.style.background = 'linear-gradient(135deg, #2196F3 0%, #1976D2 100%)';
            
            setTimeout(() => {
                button.innerHTML = '<span class="play-icon">✈️</span><span>Play</span>';
                button.style.background = 'linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%)';
            }, 2000);
            
            window.open(telegramUrl, '_blank');
        }
    </script>
</body>
</html>
